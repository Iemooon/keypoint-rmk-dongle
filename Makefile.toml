[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

# All three bins now link at 0x1000 - the Nordic dongle's factory boot slot
# (byte-level proof from the working ZMK receiver image) happens to equal the
# Adafruit UF2 app slot on the halves. The templates still differ: the
# receiver's FLASH length stops at 0xA0000 (rmk keymap/Vial storage lives at
# absolute 0xA0000+ on its 1MB flash) while the halves may run to near the
# end. Each build task copies the matching template into memory.x first;
# build.rs reads memory.x at build time and reruns on the change.
[tasks.memory-dongle]
command = "cmd"
args = ["/C", "copy", "/Y", "memory-dongle.x", "memory.x"]

[tasks.memory-halves]
command = "cmd"
args = ["/C", "copy", "/Y", "memory-halves.x", "memory.x"]

[tasks.objcopy-central]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "central",
    "--",
    "-O",
    "ihex",
    "rmk-central.hex",
]
dependencies = ["memory-dongle", "install-llvm-tools", "flip-link"]

[tasks.objcopy-left]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "left",
    "--",
    "-O",
    "ihex",
    "rmk-left.hex",
]
dependencies = ["memory-halves", "install-llvm-tools", "flip-link"]

[tasks.uf2-left]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "rmk-left.hex",
    "--output-path",
    "rmk-left.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-left"]

[tasks.objcopy-right]
install_crate = { crate_name = "cargo-binutils", binary = "cargo", test_arg = [
    "objcopy",
    "--help",
] }
command = "cargo"
args = [
    "objcopy",
    "--release",
    "--bin",
    "right",
    "--",
    "-O",
    "ihex",
    "rmk-right.hex",
]
dependencies = ["memory-halves", "install-llvm-tools", "flip-link"]

[tasks.uf2-right]
install_crate = { crate_name = "cargo-hex-to-uf2", binary = "cargo", test_arg = [
    "hex-to-uf2",
    "--help",
] }
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "rmk-right.hex",
    "--output-path",
    "rmk-right.uf2",
    "--family",
    "nrf52840",
]
dependencies = ["objcopy-right"]

# Receiver firmware: `cargo make dongle` -> rmk-central.hex, flashed with
# nRF Connect Programmer (hex carries its own 0x1000 addresses).
[tasks.dongle]
dependencies = ["objcopy-central"]

# Half firmwares: `cargo make uf2` -> rmk-left.uf2 + rmk-right.uf2, dragged
# onto each BOOT2338 drive.
[tasks.uf2]
dependencies = ["uf2-left", "uf2-right"]
